let track="word", current="WP02", voices=[];
const q=document.getElementById("q"), rate=document.getElementById("rate"), voice=document.getElementById("voice"), status=document.getElementById("status");
document.getElementById("ver").textContent=DATA.version;document.getElementById("progress").textContent=`目前：${DATA.progress.lesson} / ${DATA.progress.word}｜最後完成 ${DATA.progress.last}｜下一句 ${DATA.progress.next}｜預載 ${DATA.progress.preload.join("・")}`;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function score(v){let n=(v.name+" "+v.voiceURI).toLowerCase(),s=0;if((v.lang||"").toLowerCase().startsWith("th"))s+=10;["male","man","ชาย","ผู้ชาย","deep"].forEach(x=>{if(n.includes(x))s+=3});return s}
function loadVoices(){if(!("speechSynthesis" in window)){voice.innerHTML="<option>瀏覽器無 Web Speech API</option>";status.textContent="發音：將使用線上備援";return}voices=speechSynthesis.getVoices().filter(v=>(v.lang||"").toLowerCase().startsWith("th")).sort((a,b)=>score(b)-score(a));voice.innerHTML="";if(!voices.length){voice.innerHTML="<option>裝置沒有泰語聲音</option>";status.textContent="發音：裝置無泰語聲音，按鈕將嘗試線上備援";return}voices.forEach((v,i)=>{let o=document.createElement("option");o.value=i;o.textContent=v.name+(i===0?"（優先）":"");voice.appendChild(o)});status.textContent="發音：泰語 TTS 已就緒"}
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
let fallbackAudio=null;function onlineFallback(t){try{if(fallbackAudio){fallbackAudio.pause();fallbackAudio=null}const u="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=th&q="+encodeURIComponent(t);const a=new Audio(u);fallbackAudio=a;a.preload="auto";let started=false;const timer=setTimeout(()=>{if(!started){a.pause();status.textContent="發音失敗：線上備援載入逾時"}},5000);a.onplaying=()=>{started=true;clearTimeout(timer);status.textContent="播放中（線上備援）："+t};a.onended=()=>{clearTimeout(timer);status.textContent="發音：播放完成（線上備援）"};a.onerror=()=>{clearTimeout(timer);status.textContent="發音失敗：裝置TTS與線上備援皆不可用"};a.play().catch(()=>{clearTimeout(timer);status.textContent="發音失敗：瀏覽器阻擋音訊播放"})}catch(e){status.textContent="發音失敗："+e.message}}
function speak(t){if(!("speechSynthesis" in window)||!voices.length){onlineFallback(t);return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="th-TH";u.rate=parseFloat(rate.value);u.pitch=.95;u.volume=1;let i=parseInt(voice.value||"0");if(voices[i])u.voice=voices[i];u.onstart=()=>status.textContent="播放中："+t;u.onend=()=>status.textContent="發音：播放完成";u.onerror=()=>onlineFallback(t);speechSynthesis.speak(u)}catch(e){onlineFallback(t)}}
function currentSet(){return track==="word"?DATA.word:DATA.manager}
function tabs(){const obj=currentSet(),keys=Object.keys(obj);if(!keys.includes(current))current=track==="word"?"WP02":"M02";document.getElementById("tabs").innerHTML=keys.map(k=>`<button class="tab ${k===current?"active":""}" data-k="${k}">${k}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=b.dataset.k;tabs();render()})}
function card(x){const [id,zh,th]=x,add=id.startsWith("A");return `<article class="card"><div class="meta"><span class="id">${esc(id)}${add?'<span class="badge">補充</span>':''}</span><button class="speak" type="button" data-th="${esc(th)}">▶ 發音</button></div><div class="zh">${esc(zh)}</div><div class="th" lang="th">${esc(th)}</div></article>`}
function render(){const obj=currentSet(),l=obj[current],term=q.value.trim().toLowerCase();let arr=l.items.filter(x=>!term||(x.join(" ").toLowerCase().includes(term)));let notice=(track==="word"&&l.partial)?'<div class="notice">WP12 目前僅有 เคย 的正式內容；第24詞 เข้า 尚未建立，不得自行補入。</div>':"";document.getElementById("main").innerHTML=`<div class="head"><h2>${current}｜${esc(l.title)}</h2><span class="count">${arr.length} 句</span></div>${notice}`+(arr.map(card).join("")||"<p>找不到符合內容</p>");document.querySelectorAll(".speak").forEach(b=>b.onclick=()=>speak(b.dataset.th))}
document.querySelectorAll(".trackbtn").forEach(b=>b.onclick=()=>{track=b.dataset.track;document.querySelectorAll(".trackbtn").forEach(x=>x.classList.toggle("active",x===b));current=track==="word"?"WP02":"M02";q.value="";tabs();render()});q.oninput=render;tabs();render();
</script></body></html>
