<style>

<header><h1>Manager Thai｜管理者泰語</h1><div class="sub">每句：中文 → 泰文 → 泰語發音｜資料版本 2026-09-14</div>
<div class="toolbar"><input id="q" placeholder="搜尋中文或泰文"><select id="rate"><option value=".72">慢速 0.72×</option><option value=".82" selected>學習 0.82×</option><option value=".92">接近正常 0.92×</option><option value="1">正常 1.00×</option></select></div>

<script>
const DATA={"lessons":[{"code":"M01","title":"傳資料與文件","items":[{"id":"M01-01","th":"ส่งข้อมูลให้ผมหน่อยครับ","zh":"把資料傳給我一下"},{"id":"M01-02","th":"ได้ครับ","zh":"好的"},{"id":"M01-03","th":"ส่งไฟล์ให้ผมหน่อยครับ","zh":"把文件傳給我一下"},{"id":"M01-04","th":"ได้ครับ เดี๋ยวส่งให้ครับ","zh":"好，我等一下傳給你"},{"id":"M01-05","th":"ส่งทางไลน์ได้ไหมครับ","zh":"可以用LINE傳嗎"},{"id":"M01-06","th":"ได้ครับ","zh":"可以"},{"id":"M01-07","th":"ส่งแล้วบอกผมด้วยครับ","zh":"傳完跟我說一下"},{"id":"M01-08","th":"ได้ครับ ส่งแล้วจะบอกครับ","zh":"好，傳完我會告訴你"}]},{"code":"M02","title":"詢問工作進度","items":[{"id":"M02-01","th":"ทำถึงไหนแล้วครับ","zh":"做到哪裡了"},{"id":"M02-02","th":"ทำไปประมาณครึ่งหนึ่งแล้วครับ","zh":"已經做大約一半了"},{"id":"M02-03","th":"เสร็จหรือยังครับ","zh":"完成了嗎"},{"id":"M02-04","th":"ยังไม่เสร็จครับ","zh":"還沒完成"},{"id":"M02-05","th":"อีกนานไหมครับ","zh":"還要很久嗎"},{"id":"M02-06","th":"อีกประมาณยี่สิบนาทีครับ","zh":"還要大約20分鐘"},{"id":"M02-07","th":"วันนี้เสร็จไหมครับ","zh":"今天能完成嗎"},{"id":"M02-08","th":"เสร็จครับ","zh":"可以完成"}]},{"code":"M03","title":"完成時間與期限","items":[{"id":"M03-01","th":"จะเสร็จกี่โมงครับ","zh":"幾點會完成"},{"id":"M03-02","th":"น่าจะเสร็จประมาณบ่ายสามครับ","zh":"應該大約下午三點完成"},{"id":"M03-03","th":"วันนี้เสร็จทันไหมครับ","zh":"今天來得及完成嗎"},{"id":"M03-04","th":"ทันครับ","zh":"來得及"},{"id":"M03-05","th":"เสร็จก่อนบ่ายสามนะครับ","zh":"下午三點前完成"},{"id":"M03-06","th":"ได้ครับ","zh":"好的"},{"id":"M03-07","th":"ถ้าไม่ทันบอกผมก่อนนะครับ","zh":"如果來不及要先告訴我"},{"id":"M03-08","th":"ได้ครับ","zh":"好的"}]},{"code":"M04","title":"催進度與優先順序","items":[{"id":"M04-01","th":"งานนี้ด่วนครับ","zh":"這件工作很急"},{"id":"M04-02","th":"ทำอันนี้ก่อนครับ","zh":"先做這個"},{"id":"M04-03","th":"ติดปัญหาอะไรไหมครับ","zh":"有卡什麼問題嗎"},{"id":"M04-04","th":"ไม่มีครับ","zh":"沒有"},{"id":"M04-05","th":"เร็วขึ้นหน่อยครับ","zh":"再快一點"},{"id":"M04-06","th":"ได้ครับ","zh":"好的"},{"id":"M04-07","th":"เสร็จแล้วบอกผมด้วยครับ","zh":"完成後跟我說"},{"id":"M04-08","th":"ได้ครับ","zh":"好的"}]},{"code":"M05","title":"生產狀況","items":[{"id":"M05-01","th":"วันนี้ผลิตเป็นไงบ้างครับ","zh":"今天生產怎麼樣"},{"id":"M05-02","th":"ตอนนี้ได้กี่ชิ้นแล้วครับ","zh":"現在做多少件了"},{"id":"M05-03","th":"วันนี้ผลิตทันตามแผนไหมครับ","zh":"今天生產來得及按計畫嗎"},{"id":"M05-04","th":"ทันครับ","zh":"來得及"},{"id":"M05-05","th":"ไลน์ผลิตมีปัญหาไหมครับ","zh":"生產線有問題嗎"},{"id":"M05-06","th":"มีปัญหานิดหน่อยครับ","zh":"有一點問題"},{"id":"M05-07","th":"แก้ไขแล้วหรือยังครับ","zh":"已經處理好了嗎"},{"id":"M05-08","th":"เรียบร้อยแล้วครับ","zh":"已經處理好了"}]},{"code":"M06","title":"出貨管理","items":[{"id":"M06-01","th":"วันนี้ส่งสินค้าได้ไหมครับ","zh":"今天可以出貨嗎"},{"id":"M06-02","th":"ได้ครับ","zh":"可以"},{"id":"M06-03","th":"จะส่งกี่โมงครับ","zh":"幾點出貨"},{"id":"M06-04","th":"ประมาณบ่ายสองครับ","zh":"大約下午兩點"},{"id":"M06-05","th":"จำนวนครบไหมครับ","zh":"數量齊嗎"},{"id":"M06-06","th":"ครบครับ","zh":"齊了"},{"id":"M06-07","th":"ส่งแล้วบอกผมด้วยครับ","zh":"出貨後跟我說"},{"id":"M06-08","th":"ได้ครับ","zh":"好的"}]},{"code":"M07","title":"問題與原因","items":[{"id":"M07-01","th":"เกิดอะไรขึ้นครับ","zh":"發生什麼事"},{"id":"M07-02","th":"ปัญหาคืออะไรครับ","zh":"問題是什麼"},{"id":"M07-03","th":"รู้สาเหตุหรือยังครับ","zh":"知道原因了嗎"},{"id":"M07-04","th":"รู้แล้วครับ","zh":"知道了"},{"id":"M07-05","th":"เกิดจากอะไรครับ","zh":"是什麼造成的"},{"id":"M07-06","th":"กำลังตรวจสอบอยู่ครับ","zh":"正在檢查"},{"id":"M07-07","th":"เช็กแล้วบอกผมด้วยครับ","zh":"查完告訴我"},{"id":"M07-08","th":"ได้ครับ","zh":"好的"}]},{"code":"M08","title":"要求改善","items":[{"id":"M08-01","th":"แก้เรื่องนี้หน่อยครับ","zh":"處理一下這件事"},{"id":"M08-02","th":"ได้ครับ","zh":"好的"},{"id":"M08-03","th":"เช็กอีกทีนะครับ","zh":"再檢查一次"},{"id":"M08-04","th":"ได้ครับ","zh":"好的"},{"id":"M08-05","th":"อย่าให้เกิดอีกนะครับ","zh":"不要再發生"},{"id":"M08-06","th":"เข้าใจแล้วครับ","zh":"明白"},{"id":"M08-07","th":"แก้แล้วบอกผมด้วยครับ","zh":"處理好告訴我"},{"id":"M08-08","th":"ได้ครับ","zh":"好的"}]},{"code":"M09","title":"品質異常","items":[{"id":"M09-01","th":"เจอของเสียกี่ชิ้นครับ","zh":"發現多少不良品"},{"id":"M09-02","th":"สิบชิ้นครับ","zh":"十件"},{"id":"M09-03","th":"รู้สาเหตุหรือยังครับ","zh":"知道原因了嗎"},{"id":"M09-04","th":"กำลังตรวจสอบครับ","zh":"正在檢查"},{"id":"M09-05","th":"แยกของเสียไว้ก่อนครับ","zh":"先把不良品隔離"},{"id":"M09-06","th":"ได้ครับ","zh":"好的"},{"id":"M09-07","th":"รู้สาเหตุแล้วบอกผมด้วยครับ","zh":"知道原因後告訴我"},{"id":"M09-08","th":"ได้ครับ","zh":"好的"}]},{"code":"M10","title":"會議管理","items":[{"id":"M10-01","th":"เริ่มประชุมกันเลยครับ","zh":"開始開會吧"},{"id":"M10-02","th":"อัปเดตหน่อยครับ","zh":"更新一下"},{"id":"M10-03","th":"มีปัญหาอะไรไหมครับ","zh":"有什麼問題嗎"},{"id":"M10-04","th":"ไม่มีครับ","zh":"沒有"},{"id":"M10-05","th":"วันนี้ทำอะไรบ้างครับ","zh":"今天要做什麼"},{"id":"M10-06","th":"ได้ครับ","zh":"好的"},{"id":"M10-07","th":"พรุ่งนี้อัปเดตอีกทีนะครับ","zh":"明天再更新一次"},{"id":"M10-08","th":"ได้ครับ","zh":"好的"}]},{"code":"M11","title":"人員安排","items":[{"id":"M11-01","th":"งานนี้ใครรับผิดชอบครับ","zh":"這件工作誰負責"},{"id":"M11-02","th":"ผมรับผิดชอบครับ","zh":"我負責"},{"id":"M11-03","th":"คนพอไหมครับ","zh":"人手夠嗎"},{"id":"M11-04","th":"ไม่พอครับ","zh":"不夠"},{"id":"M11-05","th":"ต้องการคนเพิ่มกี่คนครับ","zh":"需要增加幾個人"},{"id":"M11-06","th":"อีกสองคนครับ","zh":"再兩個人"},{"id":"M11-07","th":"เดี๋ยวผมจัดคนให้ครับ","zh":"我等一下安排人給你"},{"id":"M11-08","th":"ขอบคุณครับ","zh":"謝謝"}]},{"code":"M12","title":"管理者整合對話","items":[{"id":"M12-01","th":"งานนี้ทำถึงไหนแล้วครับ","zh":"這個工作做到哪裡了"},{"id":"M12-02","th":"ประมาณเจ็ดสิบเปอร์เซ็นต์แล้วครับ","zh":"大約70%了"},{"id":"M12-03","th":"ตอนนี้มีปัญหาอะไรไหมครับ","zh":"現在有什麼問題嗎"},{"id":"M12-04","th":"มีปัญหานิดหน่อยครับ","zh":"有一點問題"},{"id":"M12-05","th":"วันนี้เสร็จทันไหมครับ","zh":"今天來得及完成嗎"},{"id":"M12-06","th":"น่าจะทันครับ","zh":"應該來得及"},{"id":"M12-07","th":"ถ้าไม่ทันบอกผมก่อนนะครับ","zh":"如果來不及先告訴我"},{"id":"M12-08","th":"ได้ครับ","zh":"好的"}]}],"additions":[{"id":"A001","zh":"現在有什麼更新嗎？","th":"ตอนนี้มีอัปเดตอะไรไหม?"},{"id":"A002","zh":"為什麼過了這麼久還沒有進展？","th":"ทำไมผ่านไปนานแล้วยังไม่มีความคืบหน้า?"},{"id":"A003","zh":"現在有在使用 GPT 嗎？","th":"ตอนนี้ได้ใช้ GPT อยู่ไหม?"},{"id":"A004","zh":"如果來不及，怎麼辦？","th":"ถ้าไม่ทันทำไง?"},{"id":"A005","zh":"那你覺得怎麼辦？","th":"แล้วคุณคิดว่าทำไง?"},{"id":"A006","zh":"照那樣做","th":"ทำตามนั้นนะ"},{"id":"A007","zh":"那你覺得呢？","th":"แล้วคุณคิดว่าไง?"},{"id":"A008","zh":"還有其他的嗎？／還有其他意見嗎？","th":"มีอะไรอีกไหม?"},{"id":"A009","zh":"快完成了嗎？","th":"ใกล้เสร็จหรือยัง?"},{"id":"A010","zh":"還沒完成嗎？","th":"ยังไม่เสร็จเหรอ?"},{"id":"A011","zh":"今天一定要完成","th":"ต้องเสร็จวันนี้นะ"},{"id":"A012","zh":"什麼時候一定要完成？","th":"ต้องเสร็จเมื่อไหร่?"},{"id":"A013","zh":"為什麼還沒完成？","th":"ทำไมยังไม่เสร็จครับ?"},{"id":"A014","zh":"今天會完成嗎？","th":"วันนี้จะเสร็จไหม?"},{"id":"A015","zh":"我了解了／我明白了","th":"เข้าใจแล้วครับ"},{"id":"A016","zh":"我知道了","th":"รู้แล้วครับ"},{"id":"A017","zh":"看到了嗎？／有看到嗎？","th":"เห็นไหมครับ?"},{"id":"A018","zh":"已經看到了嗎？／看過了嗎？","th":"เห็นหรือยังครับ?"},{"id":"A019","zh":"對得上嗎？／一致嗎？","th":"ตรงไหมครับ?"},{"id":"A020","zh":"對嗎？／正確嗎？","th":"ถูกไหมครับ?"},{"id":"A021","zh":"你確定嗎？","th":"แน่ใจไหมครับ?"},{"id":"A022","zh":"請再檢查一次／再確認一次","th":"ลองเช็กอีกทีนะครับ"}],"version":"2026-09-14"};let cur="M01";const q=document.getElementById("q"),rate=document.getElementById("rate"),voice=document.getElementById("voice"),status=document.getElementById("status");
let voices=[];function score(v){let n=(v.name+" "+v.voiceURI).toLowerCase(),s=0;["male","man","ชาย","ผู้ชาย","deep"].forEach(x=>{if(n.includes(x))s+=5});["female","woman","หญิง","ผู้หญิง","premwadee","kanya","achara"].forEach(x=>{if(n.includes(x))s-=5});if((v.lang||"").toLowerCase().startsWith("th"))s+=2;return s}
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>(v.lang||"").toLowerCase().startsWith("th")).sort((a,b)=>score(b)-score(a));voice.innerHTML="";if(!voices.length){voice.innerHTML="<option>裝置沒有泰語聲音</option>";status.textContent="此裝置未提供泰語 TTS 聲音；可改用 Chrome/Google Speech Services。";return}voices.forEach((v,i)=>{let o=document.createElement("option");o.value=i;o.textContent=v.name+(i===0?"（優先）":"");voice.appendChild(o)});status.textContent=score(voices[0])>=5?"已選泰語男聲。":"已選泰語聲音；部分裝置不提供聲音性別資料。"}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
function speak(t){if(!("speechSynthesis" in window)){status.textContent="發音失敗：此瀏覽器不支援語音";return}try{speechSynthesis.cancel();speechSynthesis.resume();let u=new SpeechSynthesisUtterance(t);u.lang="th-TH";u.rate=parseFloat(rate.value);u.pitch=.95;let i=parseInt(voice.value||"0");if(voices[i])u.voice=voices[i];u.onstart=()=>status.textContent="播放中："+t;u.onend=()=>status.textContent="發音：播放完成";u.onerror=e=>status.textContent="發音失敗："+(e.error||"unknown");speechSynthesis.speak(u)}catch(e){status.textContent="發音失敗："+e.message}}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function card(x){return `<article class="card"><div class="meta"><span class="id">${esc(x.id)}</span><button class="speak" onclick='speak(${JSON.stringify(x.th)})'>▶ 發音</button></div><div class="zh">${esc(x.zh)}</div><div class="th" lang="th">${esc(x.th)}</div></article>`}
function tabs(){let a=DATA.lessons.map(x=>[x.code,x.code]).concat([["ADD","新增句"]]);document.getElementById("tabs").innerHTML=a.map(x=>`<button class="tab ${x[0]===cur?"active":""}" data-id="${x[0]}">${x[1]}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.id;tabs();render()})}
function render(){let term=q.value.trim().toLowerCase(),arr,title;if(cur==="ADD"){arr=DATA.additions;title="額外新增句"}else{let l=DATA.lessons.find(x=>x.code===cur);arr=l.items;title=l.code+"｜"+l.title}arr=arr.filter(x=>!term||(x.zh+x.th+x.id).toLowerCase().includes(term));document.getElementById("main").innerHTML=`<div class="head"><h2>${esc(title)}</h2></div>`+(arr.map(card).join("")||"<p>找不到符合內容</p>")}
q.oninput=render;tabs();render();
</script></body></html>
