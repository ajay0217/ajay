function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function score(v){const n=((v.name||"")+" "+(v.voiceURI||"")).toLowerCase();let s=0;if((v.lang||"").toLowerCase().startsWith("th"))s+=10;["male","man","ชาย","ผู้ชาย","deep"].forEach(x=>{if(n.includes(x))s+=3});return s}
function loadVoices(){
  if(!("speechSynthesis" in window)){voice.innerHTML="<option>瀏覽器不支援 TTS</option>";status.textContent="發音失敗：此瀏覽器不支援 Web Speech API";return}
  voices=speechSynthesis.getVoices().filter(v=>(v.lang||"").toLowerCase().startsWith("th")).sort((a,b)=>score(b)-score(a));
  voice.innerHTML="";
  if(!voices.length){voice.innerHTML="<option value=''>未偵測到泰語聲音（仍可嘗試系統TTS）</option>";status.textContent="發音：未偵測到泰語 voice；按發音會嘗試系統 th-TH TTS";return}
  voices.forEach((v,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=v.name+" · "+v.lang;voice.appendChild(o)});
  status.textContent="發音：已載入 "+voices.length+" 個泰語 voice";
}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,0);setTimeout(loadVoices,500)}else loadVoices();
function makeUtterance(t,lang,selected){const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=parseFloat(rate.value);u.pitch=.95;u.volume=1;if(selected)u.voice=selected;return u}
function speak(t){
  if(!("speechSynthesis" in window)){status.textContent="發音失敗：此瀏覽器不支援 Web Speech API";return}
  speechSynthesis.cancel();
  const i=parseInt(voice.value||"0",10),selected=voices[i]||null;let retried=false;
  const play=(lang,v)=>{
    const u=makeUtterance(t,lang,v);
    u.onstart=()=>status.textContent="播放中："+t;
    u.onend=()=>status.textContent="發音：播放完成";
    u.onerror=e=>{const err=(e&&e.error)||"unknown";if(!retried){retried=true;status.textContent="發音：第一次失敗，改用系統泰語TTS重試…";setTimeout(()=>play("th",null),120)}else status.textContent="發音失敗："+err+"（請確認 Android 的 Google 語音服務已啟用泰語）"};
    try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){status.textContent="發音失敗："+e.message}
  };
  play("th-TH",selected);
}
function card(x){const badge=x.kind==="addition"?"<span class='badge'>合併句</span>":"";return `<article class="card"><div class="meta"><div><span class="id">${esc(x.id)}</span>${badge}</div><button class="speak" type="button" data-th="${esc(x.th)}" aria-label="播放 ${esc(x.id)}">▶ 發音</button></div><div class="zh">${esc(x.zh)}</div><div class="th" lang="th">${esc(x.th)}</div></article>`}
function bindSpeak(){document.querySelectorAll(".speak").forEach(b=>b.addEventListener("click",()=>speak(b.dataset.th)))}
function renderTabs(){tabsEl.innerHTML=DATA.map(l=>`<button class="tab ${l.code===cur?"active":""}" data-code="${l.code}">${l.code}</button>`).join("");tabsEl.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{cur=b.dataset.code;q.value="";renderTabs();render()}))}
function render(){
 const term=q.value.trim().toLowerCase();
 if(term){let out="",n=0;DATA.forEach(l=>{const ms=l.items.filter(x=>(x.id+x.zh+x.th).toLowerCase().includes(term));if(ms.length){n+=ms.length;out+=`<div class="searchlesson">${esc(l.code)}｜${esc(l.title)}</div>`+ms.map(card).join("")}});main.innerHTML=`<div class="head"><h2>搜尋結果</h2><div class="count">${n} 筆</div></div>`+(out||"<p>找不到符合內容</p>")}
 else{const l=DATA.find(x=>x.code===cur)||DATA[0];main.innerHTML=`<div class="head"><h2>${esc(l.code)}｜${esc(l.title)}</h2><div class="count">${l.items.length} 句</div></div>`+l.items.map(card).join("")}
 bindSpeak();
}
q.addEventListener("input",render);renderTabs();render();
</script>
</body></html>
